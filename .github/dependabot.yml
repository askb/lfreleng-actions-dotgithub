# Dependabot configuration for the lfreleng-actions/.github repository.

version: 2
updates:
  # Workflows in this repository (action versions). This also keeps the
  # pinned lfreleng-actions/zizmor-scan-action ref in
  # .github/workflows/zizmor.yaml current; the zizmor version itself is
  # pinned inside that action and bumped in its own repository.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'CI(actions)'
    # Wait a few days before opening a bump PR so we don't churn on
    # a release that gets retracted or superseded shortly after it
    # ships. Also satisfies zizmor's `dependabot-cooldown` audit.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15

  # pyproject.toml and uv.lock: the gha-workflow-linter release the
  # allow-list sweep runs (the 'sweep' group) and the agent-script test
  # tooling (the 'dev' group). The same seven-day cooldown as the
  # actions above, with the linter excluded from it: that is a
  # first-party tool whose releases this organisation reviews, and the
  # sweep exists to run a new release promptly. A cooldown of zero is
  # not a way to say this; the schema's minimum is one day, and GitHub
  # rejects the file rather than the entry.
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'Build(deps)'
    cooldown:
      default-days: 7
      exclude:
        - 'gha-workflow-linter'
